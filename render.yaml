services:
  - type: web
    name: pawnova-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: BOT_USERNAME
        value: PawBanKey_Bot
      - key: GROUP_LINK
        sync: false
      - key: PAYMENT_QR_URL
        sync: false
      - key: PAYMENT_QR_FILE_ID
        sync: false
      - key: PAYMENT_BANK_INFO
        value: BIDV · NGUYEN VAN HOA · 8970267100
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: APP_SECRET
        generateValue: true
      - key: DB_PATH
        value: bot.db
        
