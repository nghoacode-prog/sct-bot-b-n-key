services:
  - type: web
    name: pawnova-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: BOT_USERNAME
        value: PawBanKey_Bot
      - key: GROUP_LINK
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: APP_SECRET
        generateValue: true
      - key: DB_PATH
        value: bot.db
